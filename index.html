/* ---------- Guardados: viven solo en este navegador (localStorage) ---------- */
const SKEY = "gaur-guardados";
const HOY = new Date().toLocaleDateString("sv-SE", {timeZone: "Europe/Madrid"});
let SAVED = {};
try { SAVED = JSON.parse(localStorage.getItem(SKEY) || "{}"); } catch(e){}
for (const k in SAVED) if ((SAVED[k].fin || SAVED[k].f) < HOY) delete SAVED[k];   // fuera lo pasado
const persist = () => { try { localStorage.setItem(SKEY, JSON.stringify(SAVED)); } catch(e){} };
const REG = {};
const itemOf = e => e.fecha
  ? {f: e.fecha, fin: e.fin || "", t: e.hora || "", n: e.titulo, l: [e.lugar, e.ciudad].filter(Boolean).join(" · "), p: e.precio || "", u: e.url || ""}
  : {f: e.f, fin: e.fin || "", t: e.t || "", n: e.n, l: e.l, p: e.p || "", u: e.u || ""};
const keyOf = it => `${it.f}|${it.n}|${it.l}`.toLowerCase();
function starBtn(e){
  const it = itemOf(e); if (!it.f) return "";
  const k = keyOf(it); REG[k] = it; const on = k in SAVED;
  return `<button class="star ${on ? "on" : ""}" data-k="${esc(k)}" aria-label="${on ? "Quitar de guardados" : "Guardar"}">${on ? "★" : "☆"}</button>`;
}
document.addEventListener("click", ev => {
  const b = ev.target.closest(".star"); if (!b) return;
  ev.preventDefault(); ev.stopPropagation();
  const k = b.dataset.k;
  if (k in SAVED) delete SAVED[k]; else if (REG[k]) { SAVED[k] = REG[k]; const it = REG[k]; gc("★ " + it.n + " · " + it.f, "★ " + it.n + " (" + it.f + ", desde " + view + ")"); }
  persist();
  if (view === "guardados" || ["hoy", "manana", "finde"].includes(view)) { const y = window.scrollY; render(); window.scrollTo(0, y); }
  else { document.querySelectorAll(".star").forEach(s => { if (s.dataset.k === k){ const on = k in SAVED; s.classList.toggle("on", on); s.textContent = on ? "★" : "☆"; } }); renderTabs(); }
}, true);

/* ---------- Añadir al calendario (.ics) ---------- */
function ics(it){
  const d = it.f.replace(/-/g, ""), m = /(\d{1,2})[:.h](\d{2})/i.exec(it.t || "");
  const txt = s => String(s || "").replace(/[\\,;]/g, c => "\\" + c).replace(/\n/g, " ");
  let when;
  if (m) {
    const h = m[1].padStart(2, "0"), h2 = String(Math.min(23, +m[1] + 2)).padStart(2, "0");
    when = `DTSTART;TZID=Europe/Madrid:${d}T${h}${m[2]}00\r\nDTEND;TZID=Europe/Madrid:${d}T${h2}${m[2]}00`;
  } else {
    const fin = new Date((it.fin || it.f) + "T12:00:00"); fin.setDate(fin.getDate() + 1);
    when = `DTSTART;VALUE=DATE:${d}\r\nDTEND;VALUE=DATE:${fin.toISOString().slice(0,10).replace(/-/g, "")}`;
  }
  const body = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Gaur Donostia//ES", "BEGIN:VEVENT",
    `UID:${d}-${Math.random().toString(36).slice(2)}@gaur`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, "").slice(0,15)}Z`,
    when, `SUMMARY:${txt(it.n)}`, `LOCATION:${txt(it.l)}`, `DESCRIPTION:${txt([it.p, it.u].filter(Boolean).join(" · "))}`,
    it.u ? `URL:${it.u}` : "", "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${txt(it.n)}`, "TRIGGER:-P1D", "END:VALARM",
    "END:VEVENT", "END:VCALENDAR"].filter(Boolean).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([body], {type: "text/calendar"}));
  a.download = "gaur-" + d + ".ics"; document.body.appendChild(a); a.click(); a.remove();
}

function renderTabs(){
  const n = Object.keys(SAVED).length;
  document.getElementById("tabs").innerHTML = DATA.map(v =>
    `<button class="tab ${v.k===view?'on':''}" data-k="${v.k}">${v.k === "guardados" ? "★" + (n ? " " + n : "") : v.tab}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
    view = b.dataset.k;
    history.replaceState(null, "", "#" + view);
    gc("pestaña-" + view, "Pestaña: " + view);
    render(); window.scrollTo(0, 0);
  });
}

function renderPicks(){
  const v = V(), title = document.getElementById("picks-title");
  // Tus ★ de estos días se añaden arriba; debajo, la selección de Claude tal cual.
  const dias = [...new Set(v.eventos.map(e => e.f).filter(Boolean))];
  const mios = Object.entries(SAVED)
    .filter(([k, it]) => dias.some(d => d >= it.f && d <= (it.fin || it.f)))
    .sort((a, b) => (a[1].f + a[1].t).localeCompare(b[1].f + b[1].t));
  const norm = s => String(s || "").toLowerCase().replace(/[«»"'“”:]/g, "").trim();
  const repetido = p => mios.some(([k, it]) => norm(it.n).includes(norm(p.n)) || norm(p.n).includes(norm(it.n)));
  const editor = v.picks.filter(p => !repetido(p));   // la selección de Claude, entera
  title.textContent = "Mi selección " + (WHEN[v.k] || "");
  title.style.display = (mios.length || editor.length) ? "" : "none";
  let html = mios.map(([k, it]) => { REG[k] = it; const a = fd(it.f); return `
    <div class="pick"><button class="star on" data-k="${esc(k)}" aria-label="Quitar de guardados">★</button>
      <h3>${esc(it.n)}</h3>
      <div class="meta">${v.varios ? a.sem + " " + a.dia + " · " : ""}${it.t ? esc(it.t) + " · " : ""}${esc(it.l)}${it.p ? " · " + esc(it.p) : ""}</div>
      <div class="why">La guardaste tú</div>
      ${it.u ? `<p><a href="${esc(it.u)}" target="_blank" rel="noopener" style="color:var(--accent)">Info →</a></p>` : ""}</div>`; }).join("");
  html += editor.map((p, i) => `
    <div class="pick"><div class="num">${mios.length + i + 1}</div>
      <h3>${esc(p.n)}</h3><div class="meta">${esc(p.m)}</div><p>${esc(p.d)}</p></div>`).join("");
  document.getElementById("picks").innerHTML = html;
}

function renderFilters(){
  const present = new Set(V().eventos.map(e => e.c));
  const cats = ["Todo", ...ORDEN.filter(c => present.has(c)), ...[...present].filter(c => !ORDEN.includes(c)), "Gratis"];
  if (!cats.includes(current)) current = "Todo";
  document.getElementById("filters").style.display = "";

  document.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    current = b.dataset.c;
    try { localStorage.setItem("gaur-cat", current); } catch(e){}
    renderFilters(); renderList();

function slotOf(e){
  if(!e.t) return "Exposiciones y actividades de varios días";
  const h = parseInt(e.t,10);
  if(isNaN(h)) return "Sin hora";
  if(h < 14) return "Mañana";
  if(h < 19) return "Tarde";
  return "Noche";
}

function renderList(){
  const v = V();
  const list = v.eventos.filter(e => current==="Todo" || (current==="Gratis" ? isFree(e) : e.c===current));
  if(!list.length){ document.getElementById("list").innerHTML = '<div class="empty">Nada en esta categoría.</div>'; return; }
  let html = "", lastDay = null, lastSlot = null;
  for(const e of list){
    if (v.varios && e.t && e.w !== lastDay){ html += `<div class="day">${esc(e.w)}</div>`; lastDay = e.w; lastSlot = null; }
    const s = slotOf(e);
    if(s !== lastSlot){ html += `<div class="slot">${s}</div>`; lastSlot = s; }
    const tags = `<span class="tag">${esc(e.c)}</span>` + (isFree(e)?'<span class="tag free">gratis</span>':'') + (e.last?'<span class="tag last">último día</span>':'');
    const inner = `<div class="t">${esc(e.t) || "—"}</div>
      <div><div class="n">${esc(e.n)}</div>
      <div class="p">${tags}${esc(e.l)}${e.p && !isFree(e) ? " · " + esc(e.p) : ""}</div></div>${starBtn(e)}`;
    html += e.u ? `<a class="ev" href="${esc(e.u)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="ev">${inner}</div>`;
  }
  document.getElementById("list").innerHTML = html;
}

const MES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DSEM = ["dom","lun","mar","mié","jue","vie","sáb"];
const fd = s => { const d = new Date(s + "T12:00:00"); return {d, dia: d.getDate(), mes: MES[d.getMonth()], sem: DSEM[d.getDay()]}; };
const cuando = e => { const a = fd(e.fecha); let s = `${a.sem} ${a.dia} ${a.mes.slice(0,3)}`;
  if (e.fin) { const b = fd(e.fin); s += ` – ${b.sem} ${b.dia} ${b.mes.slice(0,3)}`; } return s; };

function renderProximos(v){
  const zonas = ["Todo", ...new Set([...v.para_ti, ...v.grandes].map(e => e.zona).filter(Boolean))];
  if (!zonas.includes(current)) current = "Todo";
  const ok = e => current === "Todo" || e.zona === current;

  const title = document.getElementById("picks-title");
  const pt = v.para_ti.filter(ok);
  title.textContent = "Sugerencias";
  title.style.display = pt.length ? "" : "none";
  document.getElementById("picks").innerHTML = pt.map(p => `
    <div class="pick">${starBtn(p)}<h3>${esc(p.titulo)}</h3>
      <div class="meta">${esc(cuando(p))} · ${esc(p.lugar)}${p.ciudad ? " (" + esc(p.ciudad) + ")" : ""}${p.precio ? " · " + esc(p.precio) : ""}</div>
      <p>${esc(p.d)}</p>
      ${p.url ? `<p><a href="${esc(p.url)}" target="_blank" rel="noopener" style="color:var(--accent)">Entradas e info →</a></p>` : ""}</div>`).join("");

  document.getElementById("all-title").textContent = "Conciertos seleccionados";
  document.getElementById("filters").style.display = "";
  document.getElementById("filters").innerHTML = zonas.map(c =>
    `<button class="chip ${c===current?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    current = b.dataset.c; try { localStorage.setItem("gaur-cat", current); } catch(e){}
    renderProximos(V());
  });

  const list = v.grandes.filter(ok);
  let html = "", lastMonth = null;
  for (const e of list){
    const a = fd(e.fecha), m = `${a.mes} ${a.d.getFullYear()}`;
    if (m !== lastMonth){ html += `<div class="month">${m}</div>`; lastMonth = m; }
    const tags = (e.tag ? `<span class="tag last">${esc(e.tag)}</span>` : "");
    const inner = `<div class="t d">${a.dia}<small>${a.sem}${e.fin ? " +" : ""}</small></div>
      <div><div class="n">${esc(e.titulo)}</div>
      <div class="p">${tags}${esc(e.lugar)}${e.ciudad ? " · " + esc(e.ciudad) : ""}${e.precio ? " · " + esc(e.precio) : ""}</div>
      ${e.d ? `<div class="cm">${esc(e.d)}</div>` : ""}</div>${starBtn(e)}`;
    html += e.url ? `<a class="ev" href="${esc(e.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="ev">${inner}</div>`;
  }
  document.getElementById("list").innerHTML = html || '<div class="empty">Nada en esta zona.</div>';
  document.getElementById("count").textContent = v.para_ti.length + v.grandes.length;
}

  document.getElementById("picks").innerHTML = dest.map(p => `
    <div class="pick">${starBtn(p)}<h3>${esc(p.titulo)}</h3>
      <div class="meta">${esc(cuando(p))}${p.hora ? " · " + esc(p.hora) : ""} · ${esc(p.lugar)} (${esc(p.ciudad)})${p.precio ? " · " + esc(p.precio) : ""}</div>
      <p>${esc(p.d)}</p>
      ${p.url ? `<p><a href="${esc(p.url)}" target="_blank" rel="noopener" style="color:var(--accent)">Entradas e info →</a></p>` : ""}</div>`).join("");

  document.getElementById("all-title").textContent = "Todo, día a día";
  const ciudades = ["Bilbao", "Vitoria", "Pamplona", "Biarritz"].filter(c => v.lista.some(e => e.ciudad === c));
  const tipos = ["Música", "Teatro", "Danza", "Festival"].filter(c => v.lista.some(e => e.tipo === c));
  const f = document.getElementById("filters"); f.style.display = "";
  f.innerHTML = `<button class="chip ${!escCity && !escType ? "on" : ""}" data-r="1">Todo</button>`
    + ciudades.map(c => `<button class="chip ${escCity===c?"on":""}" data-city="${c}">${c}</button>`).join("")
    + `<span class="chip sep">|</span>`
    + tipos.map(c => `<button class="chip ${escType===c?"on":""}" data-type="${c}">${c}</button>`).join("");
  f.querySelectorAll(".chip[data-r]").forEach(b => b.onclick = () => { escCity = escType = ""; renderEscapadas(V()); });
  f.querySelectorAll(".chip[data-city]").forEach(b => b.onclick = () => { escCity = escCity === b.dataset.city ? "" : b.dataset.city; renderEscapadas(V()); });
  f.querySelectorAll(".chip[data-type]").forEach(b => b.onclick = () => { escType = escType === b.dataset.type ? "" : b.dataset.type; renderEscapadas(V()); });

  const list = v.lista.filter(okE);
  let html = "", lastDay = null;
  for (const e of list){
    if (e.fecha !== lastDay){ const a = fd(e.fecha); html += `<div class="day">${a.sem} ${a.dia} ${a.mes}</div>`; lastDay = e.fecha; }
    const hasta = e.fin && e.fin > e.fecha ? ` · hasta el ${fd(e.fin).dia} ${fd(e.fin).mes.slice(0,3)}` : "";
    const inner = `<div class="t">${esc(e.hora) || "—"}</div>
      <div><div class="n">${esc(e.titulo)}</div>
      <div class="p"><span class="tag">${esc(e.tipo)}</span><span class="tag city">${esc(e.ciudad)}</span>${esc(e.lugar)}${e.precio ? " · " + esc(e.precio) : ""}${hasta}</div></div>${starBtn(e)}`;
    html += e.url ? `<a class="ev" href="${esc(e.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="ev">${inner}</div>`;
  }
  document.getElementById("list").innerHTML = html || '<div class="empty">Nada con estos filtros.</div>';
  document.getElementById("count").textContent = v.lista.length;
}

function renderGuardados(){
  document.getElementById("date").textContent = "Tus planes guardados";
  document.getElementById("picks-title").style.display = "none";
  document.getElementById("picks").innerHTML = "";
  document.getElementById("all-title").textContent = "Guardados";
  document.getElementById("filters").style.display = "none";
  const items = Object.entries(SAVED).sort((a, b) => (a[1].f + a[1].t).localeCompare(b[1].f + b[1].t));
  let html = `<p class="hint">Se guardan solo en este navegador: nadie más los ve, y no pasan de un móvil a otro. Pulsa ☆ en cualquier plan para añadirlo.</p>`;
  if (!items.length) html += '<div class="empty">Todavía no has guardado nada.</div>';
  let lastMonth = null;
  for (const [k, it] of items){
    REG[k] = it;
    const a = fd(it.f), m = `${a.mes} ${a.d.getFullYear()}`;
    if (m !== lastMonth){ html += `<div class="month">${m}</div>`; lastMonth = m; }
    html += `<div class="ev"><div class="t d">${a.dia}<small>${a.sem}</small></div>
      <div><div class="n">${esc(it.n)}</div>
      <div class="p">${it.t ? esc(it.t) + " · " : ""}${esc(it.l)}${it.p ? " · " + esc(it.p) : ""}</div>
      <div class="acts"><button data-ics="${esc(k)}">📅 Al calendario</button>${it.u ? `<a href="${esc(it.u)}" target="_blank" rel="noopener" style="color:var(--accent)">Info →</a>` : ""}</div></div>
      <button class="star on" data-k="${esc(k)}" aria-label="Quitar de guardados">★</button></div>`;
  }
  document.getElementById("list").innerHTML = html;
  document.querySelectorAll("[data-ics]").forEach(b => b.onclick = () => { gc("calendario", "📅 Al calendario"); ics(SAVED[b.dataset.ics]); });
  document.getElementById("count").textContent = items.length;
}

function render(){
  const v = V();
  renderTabs();
  if (v.tipo === "guardados"){ renderGuardados(); return; }
  if (v.tipo === "escapadas"){ renderEscapadas(v); return; }
  if (v.tipo === "proximos"){
    document.getElementById("date").textContent = v.fecha + (v.actualizado ? ` · revisado el ${v.actualizado}` : "");
    renderProximos(v); return;
  }
  document.getElementById("date").textContent = v.fecha;
  document.getElementById("all-title").textContent = "Todo lo " + (WHEN[v.k] || "");
  document.getElementById("count").textContent = v.eventos.length;
  renderPicks(); renderFilters(); renderList();
}

render();
</script>
</body>
</html>
