/* ---------- Guardados: viven solo en este navegador (localStorage) ---------- */
const SKEY = "gaur-guardados";

try { SAVED = JSON.parse(localStorage.getItem(SKEY) || "{}"); } catch(e){}
for (const k in SAVED) if ((SAVED[k].fin || SAVED[k].f) < HOY) delete SAVED[k];   // fuera lo pasado
const persist = () => { try { localStorage.setItem(SKEY, JSON.stringify(SAVED)); } catch(e){} };
const REG = {};
const itemOf = e => e.fecha
  ? {f: e.fecha, fin: e.fin || "", t: e.hora || "", n: e.titulo, l: [e.lugar, e.ciudad].filter(Boolean).join(" · "), p: e.precio || "", u: e.url || ""}
  : {f: e.f, fin: e.fin || "", t: e.t || "", n: e.n, l: e.l, p: e.p || "", u: e.u || ""};
const keyOf = it => `${it.f}|${it.n}|${it.l}`.toLowerCase();
function starBtn(e){
  const it = itemOf(e); if (!it.f) return "";
  const k = keyOf(it); REG[k] = it; const on = k in SAVED;

/* ---------- Añadir al calendario (.ics) ---------- */
function ics(it){
  const d = it.f.replace(/-/g, ""), m = /(\d{1,2})[:.h](\d{2})/i.exec(it.t || "");
  const txt = s => String(s || "").replace(/[\\,;]/g, c => "\\" + c).replace(/\n/g, " ");
  let when;
  if (m) {
    const h = m[1].padStart(2, "0"), h2 = String(Math.min(23, +m[1] + 2)).padStart(2, "0");
    when = `DTSTART;TZID=Europe/Madrid:${d}T${h}${m[2]}00\r\nDTEND;TZID=Europe/Madrid:${d}T${h2}${m[2]}00`;
  } else {
    const fin = new Date((it.fin || it.f) + "T12:00:00"); fin.setDate(fin.getDate() + 1);
    when = `DTSTART;VALUE=DATE:${d}\r\nDTEND;VALUE=DATE:${fin.toISOString().slice(0,10).replace(/-/g, "")}`;
  }
  const body = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Gaur Donostia//ES", "BEGIN:VEVENT",
    `UID:${d}-${Math.random().toString(36).slice(2)}@gaur`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, "").slice(0,15)}Z`,
    when, `SUMMARY:${txt(it.n)}`, `LOCATION:${txt(it.l)}`, `DESCRIPTION:${txt([it.p, it.u].filter(Boolean).join(" · "))}`,
    it.u ? `URL:${it.u}` : "", "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${txt(it.n)}`, "TRIGGER:-P1D", "END:VALARM",
    "END:VEVENT", "END:VCALENDAR"].filter(Boolean).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([body], {type: "text/calendar"}));
  a.download = "gaur-" + d + ".ics"; document.body.appendChild(a); a.click(); a.remove();
}

function slotOf(e){
  if(!e.t) return "Exposiciones y actividades de varios días";
  const h = parseInt(e.t,10);
  if(isNaN(h)) return "Sin hora";
  if(h < 14) return "Mañana";
  if(h < 19) return "Tarde";
  return "Noche";
}

function renderList(){
  const v = V();
  const list = v.eventos.filter(e => current==="Todo" || (current==="Gratis" ? isFree(e) : e.c===current));
  if(!list.length){ document.getElementById("list").innerHTML = '<div class="empty">Nada en esta categoría.</div>'; return; }
  let html = "", lastDay = null, lastSlot = null;
  for(const e of list){
    if (v.varios && e.t && e.w !== lastDay){ html += `<div class="day">${esc(e.w)}</div>`; lastDay = e.w; lastSlot = null; }
    const s = slotOf(e);
    if(s !== lastSlot){ html += `<div class="slot">${s}</div>`; lastSlot = s; }
    const tags = `<span class="tag">${esc(e.c)}</span>` + (isFree(e)?'<span class="tag free">gratis</span>':'') + (e.last?'<span class="tag last">último día</span>':'');
    const inner = `<div class="t">${esc(e.t) || "—"}</div>
      <div><div class="n">${esc(e.n)}</div>
      <div class="p">${tags}${esc(e.l)}${e.p && !isFree(e) ? " · " + esc(e.p) : ""}</div></div>${starBtn(e)}`;
    html += e.u ? `<a class="ev" href="${esc(e.u)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="ev">${inner}</div>`;
  }
  document.getElementById("list").innerHTML = html;
}

      ${p.url ? `<p><a href="${esc(p.url)}" target="_blank" rel="noopener" style="color:var(--accent)">Entradas e info →</a></p>` : ""}</div>`).join("");

  document.getElementById("all-title").textContent = "Los grandes";
  document.getElementById("filters").style.display = "";
  document.getElementById("filters").innerHTML = zonas.map(c =>
    `<button class="chip ${c===current?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    current = b.dataset.c; try { localStorage.setItem("gaur-cat", current); } catch(e){}
    renderProximos(V());
  });

  const list = v.grandes.filter(ok);
  let html = "", lastMonth = null;
  for (const e of list){
    const a = fd(e.fecha), m = `${a.mes} ${a.d.getFullYear()}`;
    if (m !== lastMonth){ html += `<div class="month">${m}</div>`; lastMonth = m; }
    const tags = (e.tag ? `<span class="tag last">${esc(e.tag)}</span>` : "");
    const inner = `<div class="t d">${a.dia}<small>${a.sem}${e.fin ? " +" : ""}</small></div>
      <div><div class="n">${esc(e.titulo)}</div>
      <div class="p">${tags}${esc(e.lugar)}${e.ciudad ? " · " + esc(e.ciudad) : ""}${e.precio ? " · " + esc(e.precio) : ""}</div>
      ${e.d ? `<div class="cm">${esc(e.d)}</div>` : ""}</div>${starBtn(e)}`;
    html += e.url ? `<a class="ev" href="${esc(e.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="ev">${inner}</div>`;
  }
  document.getElementById("list").innerHTML = html || '<div class="empty">Nada en esta zona.</div>';
  document.getElementById("count").textContent = v.para_ti.length + v.grandes.length;
}

function renderGuardados(){
  document.getElementById("date").textContent = "Tus planes guardados";
  document.getElementById("picks-title").style.display = "none";
  document.getElementById("picks").innerHTML = "";
  document.getElementById("all-title").textContent = "Guardados";
  document.getElementById("filters").style.display = "none";
  const items = Object.entries(SAVED).sort((a, b) => (a[1].f + a[1].t).localeCompare(b[1].f + b[1].t));
  let html = `<p class="hint">Se guardan solo en este navegador: nadie más los ve, y no pasan de un móvil a otro. Pulsa ☆ en cualquier plan para añadirlo.</p>`;
  if (!items.length) html += '<div class="empty">Todavía no has guardado nada.</div>';
  let lastMonth = null;
  for (const [k, it] of items){
    REG[k] = it;
    const a = fd(it.f), m = `${a.mes} ${a.d.getFullYear()}`;
    if (m !== lastMonth){ html += `<div class="month">${m}</div>`; lastMonth = m; }
    html += `<div class="ev"><div class="t d">${a.dia}<small>${a.sem}</small></div>
      <div><div class="n">${esc(it.n)}</div>
      <div class="p">${it.t ? esc(it.t) + " · " : ""}${esc(it.l)}${it.p ? " · " + esc(it.p) : ""}</div>
      <div class="acts"><button data-ics="${esc(k)}">📅 Al calendario</button>${it.u ? `<a href="${esc(it.u)}" target="_blank" rel="noopener" style="color:var(--accent)">Info →</a>` : ""}</div></div>
      <button class="star on" data-k="${esc(k)}" aria-label="Quitar de guardados">★</button></div>`;
  }
  document.getElementById("list").innerHTML = html;
  document.querySelectorAll("[data-ics]").forEach(b => b.onclick = () => ics(SAVED[b.dataset.ics]));
  document.getElementById("count").textContent = items.length;
}

function render(){
  const v = V();
  renderTabs();
  if (v.tipo === "guardados"){ renderGuardados(); return; }
  if (v.tipo === "proximos"){
    document.getElementById("date").textContent = v.fecha + (v.actualizado ? ` · revisado el ${v.actualizado}` : "");
    renderProximos(v); return;
  }
  document.getElementById("date").textContent = v.fecha;
  document.getElementById("all-title").textContent = "Todo lo " + (WHEN[v.k] || "");
  document.getElementById("count").textContent = v.eventos.length;
  renderPicks(); renderFilters(); renderList();
}

render();
</script>
</body>
</html>
